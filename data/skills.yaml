  description_en: 'Obsidian second-brain workflow: wiki (build persistent vault + route) -> wiki-ingest (ingest files/URLs, extract entities + wiki-links) / save (archive chats into structured notes) / autoresearch (auto search, synthesize, archive) -> wiki-query (query + write back) / wiki-retrieve (hybrid retrieval/rerank/snippets) -> wiki-lint (orphans/dead-links/metadata) / wiki-fold (fold logs); wiki-cli is the shared transport, wiki-mode configures LYT/PARA/Zettelkasten.'
  sources:
  - claude-obsidian
