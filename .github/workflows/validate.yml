name: Validate Data

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml 'pypinyin==0.55.0'
      - name: Validate YAML data
        run: python3 scripts/validate.py
      - name: Re-render HTML to ensure parity
        run: |
          python3 scripts/gen_html.py
          # 检查 git status 干净（即 PR 应该已经包含重新生成的 HTML）
          if [ -n "$(git status --porcelain docs/index.html docs/data.json)" ]; then
            echo "❌ docs/index.html 或 docs/data.json 与当前 yaml 不一致"
            echo "   请运行 python3 scripts/gen_html.py 后再提交"
            git diff docs/index.html docs/data.json | head -30
            exit 1
          fi
          echo "✅ HTML 与 YAML 一致"
