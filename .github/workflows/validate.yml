name: Validate Data

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'packages/skills-atlas-cli/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'packages/skills-atlas-cli/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml 'pypinyin==0.55.0'
      - name: Validate YAML data
        run: python3 scripts/validate.py
      - name: Re-render HTML to ensure parity
        run: |
          python3 scripts/gen_html.py
          if [ -n "$(git status --porcelain docs/index.html docs/data.json)" ]; then
            # PR 里仍要求带上重新生成的 docs（保持 diff 可审）；
            # push 到 main 的 yaml-only 改动不算错——由 build-docs.yml 自动重生成 + 部署。
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "❌ docs/index.html 或 docs/data.json 与当前 yaml 不一致"
              echo "   请运行 python3 scripts/gen_html.py 后再提交（或合并到 main 后由 Build & Deploy Docs 自动生成）"
              git diff docs/index.html docs/data.json | head -30
              exit 1
            fi
            echo "ℹ️ docs 与 yaml 不一致；合并到 main 后由 'Build & Deploy Docs' 自动重生成并部署"
          else
            echo "✅ HTML 与 YAML 一致"
          fi

  cli-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 零运行时依赖，无需 npm install。先 build 把 docs/data.json 拷成离线快照，
      # 测试才能 loadData 到目录数据；再跑 node --test。
      - name: Build offline snapshot
        run: npm run build
        working-directory: packages/skills-atlas-cli
      - name: Run CLI tests
        run: npm test
        working-directory: packages/skills-atlas-cli
