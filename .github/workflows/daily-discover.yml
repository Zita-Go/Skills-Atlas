name: Daily Skill Discovery

# 每天扫 GitHub Search，把新候选 skill 仓库提到 data/_inbox/raw/，
# 同时开一个 Issue 给人审。
#
# 阶段 1（PR-1）：纯发现 + Issue。不调 LLM。
# 后续 PR-2/3 会在这个 workflow 中加 LLM 过滤 + 草拟入库 patch 步骤。
on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00 ≈ 北京时间 10:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: 不开 Issue，只生成 raw JSON 并 PR
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pyyaml

      - name: Discover candidates
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/discover_candidates.py
          today=$(date -u +%F)
          raw="data/_inbox/raw/${today}.json"
          if [ ! -f "$raw" ]; then
            echo "::error::expected raw json not produced: $raw"
            exit 1
          fi
          echo "raw_path=$raw" >> "$GITHUB_OUTPUT"
          echo "today=$today" >> "$GITHUB_OUTPUT"
          count=$(python3 -c "import json,sys; print(len(json.load(open('$raw'))['candidates']))")
          echo "candidate_count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count candidate(s)."

      - name: Render Issue body
        id: render
        run: |
          python3 scripts/render_candidate_issue.py \
            "${{ steps.discover.outputs.raw_path }}" \
            --out issue-body.md
          # 顺便算个标题
          title="[discover] ${{ steps.discover.outputs.today }} ${{ steps.discover.outputs.candidate_count }} 个候选 skill 仓库"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Commit raw JSON via PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(discover): ${{ steps.discover.outputs.today }} raw candidates'
          title: 'chore(discover): ${{ steps.discover.outputs.today }} raw candidates (${{ steps.discover.outputs.candidate_count }})'
          body: |
            自动发现 ${{ steps.discover.outputs.candidate_count }} 个新 skill 候选仓库。

            - 数据：`${{ steps.discover.outputs.raw_path }}`
            - 配套 Issue（如已开）：见仓库 issue 列表 `discover-bot` 标签

            合并这个 PR 只是把 raw JSON 入库，**不会**改动 `data/repositories.yaml` /
            `data/skills.yaml`。真正入主库要走人工 PR。
          branch: chore/discover-${{ steps.discover.outputs.today }}
          delete-branch: true
          add-paths: |
            data/_inbox/raw/*.json

      - name: Open / update review Issue
        if: ${{ inputs.dry_run != true && steps.discover.outputs.candidate_count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 同一天反复触发就更新已有 Issue，避免刷屏
          existing=$(gh issue list \
            --label discover-bot \
            --state open \
            --search "${{ steps.discover.outputs.today }} in:title" \
            --json number --jq '.[0].number' || echo "")

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue-body.md
            echo "Updated existing issue #$existing"
          else
            # 标签不存在则建一个；忽略 "already exists" 错误
            gh label create discover-bot --color BFD4F2 \
              --description "Auto-generated daily skill candidates" 2>/dev/null || true
            gh issue create \
              --title "${{ steps.render.outputs.title }}" \
              --body-file issue-body.md \
              --label discover-bot
          fi
