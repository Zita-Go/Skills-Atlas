name: 加新 skill
description: 提议把一个新的 skill 加进 Atlas
labels: ["enhancement", "skill-addition"]
body:
  - type: input
    id: skill_name
    attributes:
      label: Skill 名称
      placeholder: 例如 my-cool-skill
    validations:
      required: true
  - type: input
    id: repo_url
    attributes:
      label: 源仓库 URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 一句话描述
      description: 这个 skill 做什么？
      placeholder: 自动把…
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 推荐归类（13 大类之一）
      options:
        - 软件开发与工程
        - 文档与知识管理
        - 产品管理（PM）
        - 营销 / 增长 / 销售
        - 设计 / 视觉 / 前端
        - 媒体生产
        - 数据 / 抓取 / 情报
        - 求职 / 个人办公
        - 通信 / 工具集成
        - 创业 / 财务 / 合规
        - 学术 / 科研 / 长跑研究
        - Agent 架构 / Context Engineering
        - 元能力 / Skill 治理
        - "不确定 / 需要讨论"
    validations:
      required: true
  - type: checkboxes
    id: chain
    attributes:
      label: 是否强绑定（必须配合其它 skill 使用）？
      options:
        - label: 是的，这个 skill 是某个 ⛓ 强绑定工作流的一部分
