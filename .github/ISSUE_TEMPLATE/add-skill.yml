name: Add a new skill / 加新 skill
description: Propose adding a new skill to Atlas / 提议把一个新的 skill 加进 Atlas
labels: ["enhancement", "skill-addition"]
body:
  - type: input
    id: skill_name
    attributes:
      label: Skill name / Skill 名称
      placeholder: e.g. my-cool-skill / 例如 my-cool-skill
    validations:
      required: true
  - type: input
    id: repo_url
    attributes:
      label: Source repository URL / 源仓库 URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: One-line description / 一句话描述
      description: What does this skill do? / 这个 skill 做什么？
      placeholder: Automatically… / 自动把…
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Suggested category (one of the 20) / 推荐归类（20 大类之一）
      options:
        - Software Development & Engineering
        - Documentation & Knowledge Management
        - Product Management (PM)
        - Marketing / Growth / Sales
        - Design / Visual / Frontend
        - Media Production
        - Data / Scraping / Intelligence
        - Job Search / Personal Productivity
        - Communication / Tool Integration
        - Startups / Finance / Compliance
        - Academia / Scientific Research / Long-running Research
        - Agent Architecture / Context Engineering
        - Meta-capabilities / Skill Governance
        - "Not sure / needs discussion"
    validations:
      required: true
  - type: checkboxes
    id: chain
    attributes:
      label: Is it tightly coupled (must be used with other skills)? / 是否强绑定（必须配合其它 skill 使用）？
      options:
        - label: "Yes, this skill is part of a ⛓ chained workflow / 是的，这个 skill 是某个 ⛓ 强绑定工作流的一部分"
