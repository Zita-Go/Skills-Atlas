name: Fix description or category / 修正描述 / 归类
description: A skill or group has an incorrect description, or is placed in the wrong category / 某个 skill / 分组的描述写错了，或归类放错了
labels: ["bug", "fix-description"]
body:
  - type: input
    id: target
    attributes:
      label: Target skill or group / 目标 skill / 分组
      description: The group id in skills.yaml, or a skill name / skills.yaml 里的 group id，或某个 skill 名称
      placeholder: e.g. software-engineering--1-1--001 or brainstorming / 例如 software-engineering--1-1--001 或 brainstorming
    validations:
      required: true
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type / 问题类型
      options:
        - Description inaccurate / outdated
        - Wrong category (wrong top-level or sub-group)
        - Incorrect chained (⛓) marking
        - Wrong source repo / author
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details / 详情
      description: What is wrong? What should it be? / 哪里错了？正确的应该是什么？
      placeholder: "The current description says…, but actually…; or: suggest moving from A to B / 当前描述说…，但实际上…；或：建议从 A 改归到 B"
    validations:
      required: true
  - type: input
    id: suggested_fix
    attributes:
      label: Suggested correct category (only if miscategorized) / 建议的正确归类（仅归类错误时填）
      placeholder: e.g. Data / Scraping / Intelligence → 7.1 Web scraping / 例如 数据 / 抓取 / 情报 → 7.1 网页抓取
    validations:
      required: false
