name: 功能建议
description: 给 Atlas 网站或数据结构提建议
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: 想加什么功能？
      placeholder: 例如 - 给每个 skill 加 install 命令字段
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: 为什么需要？
    validations:
      required: false
