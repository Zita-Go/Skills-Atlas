name: Fix source repository error / 修复源仓库错误
description: Report a broken link, renamed, or deleted repository / 报告失效链接 / 改名 / 删除的仓库
labels: ["bug", "source-fix"]
body:
  - type: input
    id: vendor_id
    attributes:
      label: vendor id
      description: The id field in data/repositories.yaml / data/repositories.yaml 里的 id 字段
      placeholder: e.g. superpowers / 例如 superpowers
    validations:
      required: true
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type / 问题类型
      options:
        - Broken link (404)
        - Repo renamed / moved
        - Repo deleted / private
        - SKILL.md path changed
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details / 详情
      placeholder: New link / replacement / suggested resolution... / 新链接 / 替代品 / 解决建议...
    validations:
      required: true
